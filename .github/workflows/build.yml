name: Build Android (APK + AAB)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar projeto
        run: bash setup.sh
      - name: Análise
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Testes
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Build AAB
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: hospital-empire-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hospital-empire-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Publicar APK/AAB no branch builds e na release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp build/app/outputs/flutter-apk/app-release.apk out/HospitalEmpire.apk && cp build/app/outputs/bundle/release/app-release.aab out/HospitalEmpire.aab
          cd out && git init -q && git checkout -q -b builds
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "build ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
          cd ..
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/HospitalEmpire.apk out/HospitalEmpire.aab --title "Hospital Empire (última versão)" --notes "APK para instalar no celular e AAB para a Play Store." --target "${GITHUB_SHA}"
